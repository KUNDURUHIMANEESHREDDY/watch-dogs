name: Refresh frontend lockfile

on:
  push:
    branches: [fix/frontend-vite-peer-compat-20261024]
  pull_request:
    paths:
      - frontend/package.json
      - .github/workflows/refresh-frontend-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lock from the declared compatible dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 1
