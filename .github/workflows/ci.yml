name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests and sandbox verification
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked root dependencies
        run: npm ci --no-audit --no-fund

      - name: Parse the browser entrypoint
        run: node --check web/app.js

      - name: Run unit and safety regression tests
        run: npm test

      - name: Run product sandbox verification
        run: npm run sandbox

  frontend-lockfile-bootstrap:
    name: Generate frontend lockfile candidate (temporary)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate candidate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Upload candidate for review and commit
        uses: actions/upload-artifact@v7
        with:
          name: frontend-lockfile-candidate
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 1

  frontend-build:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require committed frontend lockfile
        shell: bash
        run: test -f frontend/package-lock.json || { echo "::error::frontend/package-lock.json is required; generate it using npm and commit it"; exit 1; }

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Run frontend API contract tests
        run: npm test --prefix frontend

      - name: Build frontend
        run: npm run web:build
