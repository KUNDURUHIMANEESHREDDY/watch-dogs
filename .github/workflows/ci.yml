name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests and sandbox verification
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked root dependencies
        run: npm ci --no-audit --no-fund

      - name: Parse the browser entrypoint
        run: node --check web/app.js

      - name: Run unit and safety regression tests
        run: npm test

      - name: Run product sandbox verification
        run: npm run sandbox

  frontend-build:
    name: Frontend typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Bootstrap the lockfile with npm itself when it is missing. This step
      # only creates a CI workspace candidate; the generated file is uploaded
      # for review and committed separately before CI is considered reproducible.
      - name: Generate frontend lockfile candidate
        shell: bash
        working-directory: frontend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Upload frontend lockfile candidate
        uses: actions/upload-artifact@v7
        with:
          name: frontend-lockfile-candidate
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Run frontend API contract tests
        run: npm test --prefix frontend

      - name: Build frontend
        run: npm run web:build
