name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests and sandbox verification
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked root dependencies
        run: npm ci --no-audit --no-fund

      - name: Parse the browser entrypoint
        run: node --check web/app.js

      - name: Run unit and safety regression tests
        run: npm test

      - name: Run product sandbox verification
        run: npm run sandbox

  frontend-e2e:
    name: Frontend session recovery E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Verify session expiry returns to pairing
        run: npm run test:e2e

  frontend-build:
    name: Frontend typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require committed frontend lockfile
        shell: bash
        run: test -f frontend/package-lock.json || { echo "::error::frontend/package-lock.json is required; generate it using npm and commit it"; exit 1; }

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Run frontend API contract tests
        run: npm test --prefix frontend

      - name: Build frontend
        run: npm run web:build

  required:
    name: required
    # This aggregate is the single check repository Settings should require.
    # It fails closed if any CI job fails, is cancelled, or is unexpectedly skipped.
    if: always()
    needs: [core-tests, frontend-e2e, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce all release checks
        env:
          CORE_TESTS_RESULT: ${{ needs.core-tests.result }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.frontend-build.result }}
        run: |
          set -euo pipefail
          echo "core-tests: $CORE_TESTS_RESULT"
          echo "frontend-e2e: $FRONTEND_E2E_RESULT"
          echo "frontend-build: $FRONTEND_BUILD_RESULT"
          test "$CORE_TESTS_RESULT" = "success"
          test "$FRONTEND_E2E_RESULT" = "success"
          test "$FRONTEND_BUILD_RESULT" = "success"
