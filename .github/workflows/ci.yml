name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests and sandbox verification
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked root dependencies
        run: npm ci --no-audit --no-fund

      - name: Parse the browser entrypoint
        run: node --check web/app.js

      - name: Run unit and safety regression tests
        run: npm test

      - name: Run product sandbox verification
        run: npm run sandbox

  frontend-e2e:
    name: Frontend session recovery E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Verify session expiry returns to pairing
        run: npm run test:e2e

  frontend-build:
    name: Frontend typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require committed frontend lockfile
        shell: bash
        run: test -f frontend/package-lock.json || { echo "::error::frontend/package-lock.json is required; generate it using npm and commit it"; exit 1; }

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Run frontend API contract tests
        run: npm test --prefix frontend

      - name: Build frontend
        run: npm run web:build
