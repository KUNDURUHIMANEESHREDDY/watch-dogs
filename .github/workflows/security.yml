name: Security

on:
  workflow_call:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        directory: [".", "frontend"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Require committed frontend lockfile
        if: matrix.directory == 'frontend'
        shell: bash
        working-directory: frontend
        run: test -f package-lock.json || { echo "::error::frontend/package-lock.json is required before dependency auditing"; exit 1; }

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ${{ matrix.directory }}

      - name: Audit high and critical advisories
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.directory }}

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: Generate dependency SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install locked root dependencies
        run: npm ci --no-audit --no-fund

      - name: Require committed frontend lockfile
        shell: bash
        run: test -f frontend/package-lock.json || { echo "::error::frontend/package-lock.json is required before SBOM generation"; exit 1; }

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Generate root SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-file sbom-root.json

      - name: Generate frontend SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-file sbom-frontend.json
        working-directory: frontend

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@v7
        with:
          name: dependency-sboms
          path: |
            sbom-root.json
            frontend/sbom-frontend.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze source
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

  security-required:
    name: security-required
    if: always()
    needs: [dependency-audit, secret-scan, sbom, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless all security checks passed
        env:
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          printf 'Dependency audit: %s\\n' "$DEPENDENCY_AUDIT_RESULT"
          printf 'Secret scan: %s\\n' "$SECRET_SCAN_RESULT"
          printf 'SBOM: %s\\n' "$SBOM_RESULT"
          printf 'CodeQL: %s\\n' "$CODEQL_RESULT"
          test "$DEPENDENCY_AUDIT_RESULT" = success
          test "$SECRET_SCAN_RESULT" = success
          test "$SBOM_RESULT" = success
          test "$CODEQL_RESULT" = success
